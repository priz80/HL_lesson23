<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма с валидацией</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
        }
    </style>
</head>
<body>
    <h2>Форма ввода данных</h2>
    <form id="myForm">
        <div class="form-group">
            <label for="name">Имя (text):</label>
            <input type="text" id="name" data-type="text" placeholder="Введите имя">
        </div>
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="text" id="email" data-type="email" placeholder="example@mail.com">
        </div>
        <div class="form-group">
            <label for="phone">Телефон:</label>
            <input type="text" id="phone" data-type="phone" placeholder="+7 (999) 123-45-67">
        </div>
        <div class="form-group">
            <label for="number">Число:</label>
            <input type="text" id="number" data-type="number" placeholder="123.45">
        </div>
    </form>

    <script src="script.js"></script>
</body>
</html>
